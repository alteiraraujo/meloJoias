<div class="form-field {% if field.errors %}has-error{% endif %} {% if field.name == 'notes' or field.name == 'address' or field.name == 'description' or field.name == 'contacts' %}full-width{% endif %} {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
{% if field.name == 'contacts' %}<span class="field-label">{{ field.label }}</span>{{ field }}{% elif field.field.widget.input_type == 'checkbox' %}<label class="check-label">{{ field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="obrigatório"> *</span>{% endif %}</label>{{ field }}{% endif %}
{% if field.help_text %}<span class="field-help">{{ field.help_text }}</span>{% endif %}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
</div>
